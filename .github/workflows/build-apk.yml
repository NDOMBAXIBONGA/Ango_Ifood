name: Build Mobile Apps (Android APK & iOS IPA)

# Acionadores do Workflow: Disparado em eventos de 'push' nas branches principais
# ou manualmente através do tab 'Actions' no GitHub (workflow_dispatch).
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      macos_runner:
        description: 'Versão do Runner macOS (macos-14 / macos-15 Apple Silicon)'
        required: false
        default: 'macos-14'
        type: choice
        options:
          - 'macos-14'
          - 'macos-15'
          - 'macos-latest'

# Permissões do GITHUB_TOKEN para leitura/escrita de releases e limpeza de artefactos antigos
permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Build & Package Android Release APK
    runs-on: ubuntu-latest

    steps:
      # ==============================================================================
      # Passo 1: Checkout do código-fonte do repositório
      # ==============================================================================
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # ==============================================================================
      # Passo 1b: Limpeza automática de artefactos antigos para libertar quota
      # ==============================================================================
      - name: Limpar Artefactos Antigos (Libertar Quota GitHub)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "A remover artefactos antigos para libertar quota de armazenamento do GitHub..."
          gh api repos/${{ github.repository }}/actions/artifacts --paginate -q '.artifacts[].id' | while read -r id; do
            if [ -n "$id" ]; then
              echo "A eliminar artefacto antigo ID: $id"
              gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/"$id" || true
            fi
          done

      # ==============================================================================
      # Passo 2: Configuração do Java Development Kit (JDK 17 - Zulu)
      # ==============================================================================
      - name: Configurar Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ==============================================================================
      # Passo 2b: Configuração de Cache do Gradle (Aceleração e resiliência de download)
      # ==============================================================================
      - name: Configurar Cache do Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # ==============================================================================
      # Passo 3: Instalação e configuração do Flutter SDK (Canal Stable)
      # ==============================================================================
      - name: Instalar e Configurar o Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # ==============================================================================
      # Passo 4: Resolução de dependências na diretoria da aplicação mobile
      # ==============================================================================
      - name: Instalar Dependências do Flutter (pub get)
        working-directory: mobile
        run: |
          # Configura keystore permanente para manter a assinatura SHA-1 estável no Google Cloud OAuth
          mkdir -p ~/.android
          if [ -f "keystore/debug.keystore" ]; then
            echo "A configurar keystore permanente para manter o SHA-1 fixo..."
            cp keystore/debug.keystore ~/.android/debug.keystore
          fi

          # Garante que a infraestrutura nativa Android existe e utiliza a API v2 Embedding do Flutter
          if [ ! -f "android/build.gradle" ] && [ ! -f "android/build.gradle.kts" ]; then
            echo "Aviso: Camada nativa Android incompleta. A inicializar suporte Android v2 Embedding..."
            rm -rf android
            flutter create . --platforms=android --org com.delivery.app
            rm -f test/widget_test.dart
          fi

          # Fixa o applicationId estritamente como com.delivery.app para coincidir com a consola Google Cloud
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/applicationId "[^"]*"/applicationId "com.delivery.app"/g' android/app/build.gradle
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.delivery.app"/g' android/app/build.gradle
            printf '\nandroid {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\ntasks.configureEach { task ->\n    if (task.name.toLowerCase().contains("lint")) {\n        task.enabled = false\n    }\n}\n' >> android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.delivery.app"/g' android/app/build.gradle.kts
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\ntasks.configureEach {\n    if (name.contains("lint", ignoreCase = true)) {\n        enabled = false\n    }\n}\n' >> android/app/build.gradle.kts
          fi

          # Desativa tarefas de Lint bugadas do AGP/Kotlin em todos os subprojetos e plugins via init.d
          mkdir -p ~/.gradle/init.d
          printf 'projectsLoaded {\n    rootProject.allprojects {\n        tasks.configureEach { task ->\n            if (task.name.toLowerCase().contains("lint")) {\n                task.enabled = false\n            }\n        }\n    }\n}\n' > ~/.gradle/init.d/disable-lint.gradle

          # Otimiza memória JVM do Gradle para compilação rápida e estável
          if [ -f "android/gradle.properties" ]; then
            sed -i '/org.gradle.jvmargs/d' android/gradle.properties
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> android/gradle.properties
            echo "android.lint.checkReleaseBuilds=false" >> android/gradle.properties
          fi

          # Aplica o nome oficial 'Delivery Pro', permissões e usesCleartextTraffic no AndroidManifest.xml
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "A configurar AndroidManifest.xml (Delivery Pro, INTERNET, ACCESS_NETWORK_STATE, usesCleartextTraffic, Maps Key)..."
            sed -i 's/android:label="[^"]*"/android:label="Delivery Pro"/g' android/app/src/main/AndroidManifest.xml
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
            if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
              sed -i '/<manifest[^>]*>/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml
            fi
            if ! grep -q "com.google.android.geo.API_KEY" android/app/src/main/AndroidManifest.xml; then
              sed -i 's|</application>|    <meta-data android:name="com.google.android.geo.API_KEY" android:value="AIzaSyDummyKeyForDevelopmentPreventCrash"/>\n    </application>|g' android/app/src/main/AndroidManifest.xml
            fi
          fi

          # Configura espelho resiliente do Gradle Wrapper para evitar 504 Gateway Timeout do GitHub Releases
          WRAPPER_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROP" ]; then
            echo "A configurar espelho resiliente do Gradle Wrapper (Anti-504 Gateway Timeout)..."
            sed -i -E 's|distributionUrl=.*gradle-([0-9.]+)-([a-z]+)\.zip|distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-\1-\2.zip|g' "$WRAPPER_PROP"
            echo "Conteúdo de $WRAPPER_PROP:"
            cat "$WRAPPER_PROP"
          fi

          echo "A descarregar pacotes e dependências (flutter pub get)..."
          flutter pub get

      # ==============================================================================
      # Passo 5: Verificação estática do código Dart (flutter analyze)
      # ==============================================================================
      - name: Verificação Estática de Código (flutter analyze)
        working-directory: mobile
        run: |
          echo "A executar análise estática de código Dart..."
          flutter analyze --no-fatal-warnings --no-fatal-infos

      # ==============================================================================
      # Passo 6: Compilação nativa da aplicação Android (Release APK)
      # ==============================================================================
      - name: Compilar APK Android em Modo Release
        working-directory: mobile
        run: |
          echo "A iniciar compilação da APK Release..."
          # Garante espelho resiliente do Gradle Wrapper antes de iniciar o assembleRelease (Anti-504)
          WRAPPER_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROP" ]; then
            sed -i -E 's|distributionUrl=.*gradle-([0-9.]+)-([a-z]+)\.zip|distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-\1-\2.zip|g' "$WRAPPER_PROP"
          fi

          # A flag --no-tree-shake-icons impede que o compilador elimine glifos de ícones
          # referenciados dinamicamente, evitando a renderização de caracteres em mandarim/CJK
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=BASE_HTTP_URL=https://ango-ifood.onrender.com \
            --dart-define=BASE_WEBSOCKET_URL=wss://ango-ifood.onrender.com

      # ==============================================================================
      # Passo 7: Recolha e Publicação Direta do Artefacto APK (GitHub Releases)
      # ==============================================================================
      - name: Recolher e Disponibilizar Artefacto APK
        working-directory: mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Erro: APK compilado não encontrado em $APK_PATH"
            exit 1
          fi

          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "Artefacto APK validado com sucesso ($APK_SIZE): $APK_PATH"
          echo "A publicar APK na Release oficial 'latest' do repositório..."

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK_PATH" --clobber
          else
            gh release create latest "$APK_PATH" \
              --title "Delivery Pro - APK Release (Última Versão)" \
              --notes "APK compilado automaticamente a partir do commit ${{ github.sha }}." \
              --latest
          fi

          echo "A sincronizar APK com o portal público de download (https://ango-ifood.onrender.com/apk/)..."
          curl -s --retry 5 --retry-delay 3 --max-time 30 https://ango-ifood.onrender.com/healthz/ || true
          curl -s --retry 3 --retry-delay 5 -F "apk=@$APK_PATH" https://ango-ifood.onrender.com/apk/upload/ || true

          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/latest/app-release.apk"
          RELEASE_PAGE="https://github.com/${{ github.repository }}/releases/tag/latest"
          RENDER_PORTAL="https://ango-ifood.onrender.com/apk/"
          RENDER_DIRECT="https://ango-ifood.onrender.com/apk/download/"

          echo "======================================================================"
          echo "✅ ARTEFACTO APK DISPONIBILIZADO COM SUCESSO (0 ERROS):"
          echo "👉 Portal de Download (Telemóvel/PC sem login): $RENDER_PORTAL"
          echo "👉 Download Direto (Render): $RENDER_DIRECT"
          echo "👉 Download GitHub Releases: $DOWNLOAD_URL"
          echo "======================================================================"

          {
            echo "## 📱 Delivery Pro — APK Release Pronto!"
            echo "O artefacto APK (**$APK_SIZE**) foi compilado e disponibilizado com sucesso."
            echo ""
            echo "### ⬇️ Opções de Download Direto:"
            echo "- 📲 **[Baixar no Telemóvel ou PC (Sem precisar de Login): https://ango-ifood.onrender.com/apk/]($RENDER_PORTAL)**"
            echo "- 🚀 **[Download Direto via GitHub Releases (app-release.apk)]($DOWNLOAD_URL)**"
            echo "- 📦 **[Abrir Página de Releases do GitHub]($RELEASE_PAGE)**"
            echo "- 🔖 **Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==============================================================================
  # JOB 2: Compilação e Geração do Pacote iOS (.ipa)
  # Executa após o término do APK para evitar saturação de concorrência no GitHub Actions
  # ==============================================================================
  build-ipa:
    name: Build & Package iOS Release IPA
    needs: build-apk
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      # ==============================================================================
      # Passo 1: Checkout do código-fonte do repositório
      # ==============================================================================
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # ==============================================================================
      # Passo 2: Instalação e configuração do Flutter SDK (Mesma versão do Android)
      # ==============================================================================
      - name: Instalar e Configurar o Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # ==============================================================================
      # Passo 3: Verificação e seleção da versão do Xcode no macOS Runner
      # ==============================================================================
      - name: Verificar e Configurar o Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version
          xcrun --version

      # ==============================================================================
      # Passo 4: Instalação das dependências Flutter e inicialização nativa iOS
      # ==============================================================================
      - name: Instalar Dependências do Flutter (pub get)
        working-directory: mobile
        run: |
          # Garante que a infraestrutura nativa iOS existe
          if [ ! -d "ios" ] || [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "Aviso: Camada nativa iOS não encontrada. A inicializar suporte iOS com flutter create..."
            flutter create . --platforms=ios --org com.delivery.app
            rm -f test/widget_test.dart
          fi

          echo "A descarregar dependências do Flutter (flutter pub get)..."
          flutter pub get

      # ==============================================================================
      # Passo 4b: Cache dos CocoaPods (Pods & Spec Repos) para acelerar compilação
      # ==============================================================================
      - name: Cache de CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            mobile/ios/Pods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # ==============================================================================
      # Passo 5: Instalação dos CocoaPods na pasta ios
      # ==============================================================================
      - name: Instalar CocoaPods (pod install)
        working-directory: mobile/ios
        run: |
          echo "A configurar Podfile para compatibilidade com Swift 5.0 (Anti-Swift 6 isolation breaks)..."
          if [ -f "Podfile" ] && ! grep -q "SWIFT_VERSION" Podfile; then
            printf '\npost_install do |installer|\n  installer.pods_project.targets.each do |target|\n    flutter_additional_ios_build_settings(target)\n    target.build_configurations.each do |config|\n      config.build_settings["SWIFT_VERSION"] = "5.0"\n      config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "14.0"\n    end\n  end\nend\n' >> Podfile
          fi

          echo "A instalar pods e dependências nativas iOS via CocoaPods..."
          if [ ! -d "Pods" ] || [ ! -f "Podfile.lock" ]; then
            pod repo update --silent || true
            pod install --repo-update
          else
            pod install
          fi

      # ==============================================================================
      # Passo 6: Configuração de Assinatura de Código (Certificado .p12 & Provisioning Profile)
      # Utiliza Secrets em Base64 configurados no repositório do GitHub
      # ==============================================================================
      - name: Configurar Assinatura de Código iOS (Apple Code Signing)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ] || [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "::warning::Secrets de assinatura iOS (BUILD_CERTIFICATE_BASE64 ou BUILD_PROVISION_PROFILE_BASE64) não foram detetados."
            echo "::warning::A compilar em modo de validação com arquivamento. Configure os Secrets para gerar um IPA assinado."
            echo "SIGNED_BUILD=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "SIGNED_BUILD=true" >> $GITHUB_ENV
          echo "A preparar Keychain temporária e perfis de provisionamento..."

          # 1. Definir caminhos temporários seguros
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEY_PWD="${KEYCHAIN_PASSWORD:-temporary_runner_pwd_2026}"

          # 2. Descodificar os segredos Base64 em ficheiros binários reais
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # 3. Criar uma nova Keychain isolada no macOS
          security create-keychain -p "$KEY_PWD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEY_PWD" $KEYCHAIN_PATH

          # 4. Importar o certificado de distribuição (.p12) na Keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEY_PWD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # 5. Instalar o Perfil de Provisionamento no diretório oficial do sistema
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "Assinatura iOS e Keychain configuradas com sucesso!"

      # ==============================================================================
      # Passo 7: Garantir existência do ficheiro ExportOptions.plist
      # ==============================================================================
      - name: Validar ou Gerar ExportOptions.plist
        working-directory: mobile
        run: |
          mkdir -p ios
          if [ ! -f "ios/ExportOptions.plist" ]; then
            echo "A gerar modelo base de ExportOptions.plist..."
            cat << 'EOF' > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>compileBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
          fi
          echo "Conteúdo de ios/ExportOptions.plist:"
          cat ios/ExportOptions.plist

      # ==============================================================================
      # Passo 8: Compilação do IPA (flutter build ipa)
      # ==============================================================================
      - name: Compilar IPA iOS em Modo Release
        working-directory: mobile
        run: |
          echo "A iniciar compilação da aplicação iOS..."

          if [ "$SIGNED_BUILD" = "true" ]; then
            echo "A executar compilação com assinatura e exportação do ficheiro IPA..."
            flutter build ipa --release --no-tree-shake-icons \
              --export-options-plist=ios/ExportOptions.plist \
              --dart-define=BASE_HTTP_URL=https://ango-ifood.onrender.com \
              --dart-define=BASE_WEBSOCKET_URL=wss://ango-ifood.onrender.com
          else
            echo "A compilar binário nativo iOS com '--no-codesign' para verificação de compilação..."
            flutter build ios --release --no-codesign --no-tree-shake-icons \
              --dart-define=BASE_HTTP_URL=https://ango-ifood.onrender.com \
              --dart-define=BASE_WEBSOCKET_URL=wss://ango-ifood.onrender.com

            # Empacota em .ipa não assinado para que o artefacto esteja disponível para inspeção
            mkdir -p build/ios/ipa
            if [ -d "build/ios/iphoneos/Runner.app" ]; then
              cd build/ios/iphoneos
              mkdir -p Payload
              cp -R Runner.app Payload/
              zip -r -q ../ipa/DeliveryPro-unsigned.ipa Payload
              cd ../../..
              echo "Pacote IPA não assinado gerado em build/ios/ipa/DeliveryPro-unsigned.ipa"
            fi
          fi

      # ==============================================================================
      # Passo 9: Recolha e Publicação do Artefacto IPA (GitHub Releases & Portal Web)
      # ==============================================================================
      - name: Recolher e Sincronizar Artefacto IPA
        working-directory: mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -n "$IPA_PATH" ] && [ -f "$IPA_PATH" ]; then
            IPA_SIZE=$(du -h "$IPA_PATH" | cut -f1)
            echo "Artefacto IPA validado ($IPA_SIZE): $IPA_PATH"

            echo "A publicar IPA na Release oficial 'latest' do GitHub..."
            if gh release view latest >/dev/null 2>&1; then
              gh release upload latest "$IPA_PATH#app-release.ipa" --clobber || true
            fi

            echo "A sincronizar IPA com o portal web de download (https://ango-ifood.onrender.com/ipa/upload/)..."
            curl -s --retry 5 --retry-delay 3 --max-time 30 https://ango-ifood.onrender.com/healthz/ || true
            curl -s --retry 3 --retry-delay 5 -F "ipa=@$IPA_PATH" https://ango-ifood.onrender.com/ipa/upload/ || true
          else
            echo "Aviso: Nenhum pacote .ipa encontrado para sincronização de portal."
          fi

      # ==============================================================================
      # Passo 10: Upload do Artefacto IPA para download no GitHub Actions
      # ==============================================================================
      - name: Disponibilizar Artefacto IPA (GitHub Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: |
            mobile/build/ios/ipa/*.ipa
            mobile/build/ios/archive/*.xcarchive
          if-no-files-found: warn
          retention-days: 14

      # ==============================================================================
      # Passo 10: Resumo da Execução no GitHub Actions
      # ==============================================================================
      - name: Publicar Resumo do Job iOS (GitHub Step Summary)
        if: always()
        working-directory: mobile
        run: |
          {
            echo "## 🍏 Delivery Pro — Build iOS (IPA) Concluído!"
            echo ""
            if compgen -G "build/ios/ipa/*.ipa" > /dev/null; then
              echo "### 📦 Ficheiros Gerados:"
              for ipa in build/ios/ipa/*.ipa; do
                IPA_SIZE=$(du -h "$ipa" | cut -f1)
                echo "- 📲 **Ficheiro:** \`$(basename "$ipa")\` (**$IPA_SIZE**)"
              done
              echo ""
              echo "👉 **Download:** Descarregue o ficheiro na secção **Artifacts** deste workflow no GitHub Actions."
            else
              echo "⚠️ *Nenhum ficheiro .ipa foi gerado.* Verifique se os segredos de assinatura Apple foram devidamente configurados."
            fi
            echo "- 🔖 **Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ==============================================================================
      # Passo 11: Limpeza Segura da Keychain e Certificados Efémeros
      # ==============================================================================
      - name: Limpar Keychain e Certificados Efémeros
        if: always()
        run: |
          echo "A efetuar limpeza segura de certificados e chaves temporárias..."
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null || true
          rm -f $RUNNER_TEMP/build_certificate.p12 2>/dev/null || true
          rm -f $RUNNER_TEMP/build_profile.mobileprovision 2>/dev/null || true

