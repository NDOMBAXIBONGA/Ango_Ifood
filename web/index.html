<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal do Comerciante | Onboarding, Homologação e Horários (RN-010, RN-011, RN-012)</title>
  
  <!-- Tailwind CSS 3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 e Babel CDN para execução imediata no navegador -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const DIAS_PADRAO = [
      { diaSemana: 0, diaNome: 'Segunda-feira', isEncerrado: false, turnos: [{ id: '1', horaAbertura: '11:00', horaFecho: '15:00' }, { id: '2', horaAbertura: '18:00', horaFecho: '23:00' }] },
      { diaSemana: 1, diaNome: 'Terça-feira', isEncerrado: false, turnos: [{ id: '1', horaAbertura: '11:00', horaFecho: '15:00' }, { id: '2', horaAbertura: '18:00', horaFecho: '23:00' }] },
      { diaSemana: 2, diaNome: 'Quarta-feira', isEncerrado: false, turnos: [{ id: '1', horaAbertura: '11:00', horaFecho: '15:00' }, { id: '2', horaAbertura: '18:00', horaFecho: '23:00' }] },
      { diaSemana: 3, diaNome: 'Quinta-feira', isEncerrado: false, turnos: [{ id: '1', horaAbertura: '11:00', horaFecho: '15:00' }, { id: '2', horaAbertura: '18:00', horaFecho: '23:00' }] },
      { diaSemana: 4, diaNome: 'Sexta-feira', isEncerrado: false, turnos: [{ id: '1', horaAbertura: '11:00', horaFecho: '15:00' }, { id: '2', horaAbertura: '18:00', horaFecho: '23:30' }] },
      { diaSemana: 5, diaNome: 'Sábado', isEncerrado: false, turnos: [{ id: '1', horaAbertura: '12:00', horaFecho: '23:30' }] },
      { diaSemana: 6, diaNome: 'Domingo', isEncerrado: false, turnos: [{ id: '1', horaAbertura: '12:00', horaFecho: '22:00' }] }
    ];

    function App() {
      const [viewMode, setViewMode] = useState('ONBOARDING'); // 'ONBOARDING' | 'PENDING_REVIEW' | 'ACTIVE_HOURS'
      const [storeStatus, setStoreStatus] = useState('PENDENTE');
      const [activeStep, setActiveStep] = useState(1);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [notification, setNotification] = useState(null);

      // Dados da Empresa (RN-010)
      const [empresa, setEmpresa] = useState({
        nomeComercial: 'Restaurante Sabor de Luanda',
        nif: '5412345678',
        telefone: '+244 923 456 789',
        email: 'contacto@sabordeluanda.ao',
        moradaTexto: 'Avenida 4 de Fevereiro, n.º 120, Baixa de Luanda',
        categoriaComercial: 'Restaurante Tradicional & Grelhados'
      });
      const [empresaErrors, setEmpresaErrors] = useState({});

      // Dados Bancários (RN-010)
      const [dadosBancarios, setDadosBancarios] = useState({
        banco: 'Banco Angolano de Investimentos (BAI)',
        titularConta: 'Sabor de Luanda Restauração Lda',
        numeroConta: '0040.0000.1234.5678.9',
        iban: 'AO06 0040 0000 1234 5678 9012 3',
        swiftBic: 'BAIAAO22'
      });
      const [bancoErrors, setBancoErrors] = useState({});

      // Documentos (RN-010)
      const [licencaSanitaria, setLicencaSanitaria] = useState({ fileName: 'licenca_sanitaria_2026.pdf', fileSize: 2450000 });
      const [alvaraComercial, setAlvaraComercial] = useState({ fileName: 'alvara_comercial_valido.pdf', fileSize: 1820000 });

      // Horários Semanais (RN-012)
      const [horarios, setHorarios] = useState(DIAS_PADRAO);
      const [horarioErrors, setHorarioErrors] = useState([]);

      // Validação do Passo 1
      const validateStep1 = () => {
        const errors = {};
        if (!empresa.nomeComercial.trim()) errors.nomeComercial = 'O Nome Comercial é obrigatório.';
        const cleanNif = empresa.nif.replace(/\D/g, '');
        if (!cleanNif || cleanNif.length < 9 || cleanNif.length > 10) {
          errors.nif = 'O NIF deve conter 9 ou 10 dígitos fiscais válidos (RN-010).';
        }
        if (!empresa.telefone.trim()) errors.telefone = 'Contacto telefónico obrigatório.';
        if (!empresa.email.trim() || !empresa.email.includes('@')) errors.email = 'Email válido obrigatório.';
        if (!empresa.moradaTexto.trim()) errors.moradaTexto = 'Endereço físico obrigatório para recolha.';
        setEmpresaErrors(errors);
        return Object.keys(errors).length === 0;
      };

      // Validação do Passo 2
      const validateStep2 = () => {
        const errors = {};
        if (!dadosBancarios.banco.trim()) errors.banco = 'Instituição bancária obrigatória.';
        if (!dadosBancarios.titularConta.trim()) errors.titularConta = 'Titular da conta obrigatório.';
        if (!dadosBancarios.numeroConta.trim()) errors.numeroConta = 'Número de conta obrigatório.';
        const cleanIban = dadosBancarios.iban.replace(/\s+/g, '').toUpperCase();
        if (cleanIban.length < 21) errors.iban = 'IBAN inválido (mínimo 21 caracteres).';
        setBancoErrors(errors);
        return Object.keys(errors).length === 0;
      };

      const handleSubmitOnboarding = () => {
        setIsSubmitting(true);
        setTimeout(() => {
          setIsSubmitting(false);
          setStoreStatus('PENDENTE');
          setViewMode('PENDING_REVIEW');
          setNotification({ type: 'success', message: 'Candidatura submetida com sucesso! A conta entrou em Análise Documental (RN-011).' });
        }, 800);
      };

      // Gestão de Horários (RN-012)
      const validateSlots = (schedules) => {
        const errs = [];
        schedules.forEach(dia => {
          if (!dia.isEncerrado) {
            dia.turnos.forEach((t, idx) => {
              if (!t.horaAbertura || !t.horaFecho) {
                errs.push(`${dia.diaNome} (#${idx + 1}): Horas obrigatórias.`);
              } else if (t.horaFecho <= t.horaAbertura) {
                errs.push(`${dia.diaNome} (#${idx + 1}): Hora de fecho (${t.horaFecho}) deve ser posterior à abertura (${t.horaAbertura}).`);
              }
            });

            // Conflito de sobreposição
            const sorted = [...dia.turnos].sort((a,b) => a.horaAbertura.localeCompare(b.horaAbertura));
            for (let i = 0; i < sorted.length - 1; i++) {
              if (sorted[i+1].horaAbertura < sorted[i].horaFecho) {
                errs.push(`Conflito em ${dia.diaNome}: O turno das ${sorted[i+1].horaAbertura} sobrepõe-se ao fecho das ${sorted[i].horaFecho}.`);
              }
            }
          }
        });
        setHorarioErrors(errs);
      };

      const handleUpdateTimeSlot = (diaIdx, slotIdx, field, val) => {
        const copy = JSON.parse(JSON.stringify(horarios));
        copy[diaIdx].turnos[slotIdx][field] = val;
        setHorarios(copy);
        validateSlots(copy);
      };

      const handleAddSlot = (diaIdx) => {
        const copy = JSON.parse(JSON.stringify(horarios));
        copy[diaIdx].turnos.push({ id: String(Date.now()), horaAbertura: '19:00', horaFecho: '23:30' });
        setHorarios(copy);
        validateSlots(copy);
      };

      const handleRemoveSlot = (diaIdx, slotIdx) => {
        const copy = JSON.parse(JSON.stringify(horarios));
        if (copy[diaIdx].turnos.length > 1) {
          copy[diaIdx].turnos.splice(slotIdx, 1);
          setHorarios(copy);
          validateSlots(copy);
        }
      };

      const handleToggleEncerrado = (diaIdx) => {
        const copy = JSON.parse(JSON.stringify(horarios));
        copy[diaIdx].isEncerrado = !copy[diaIdx].isEncerrado;
        setHorarios(copy);
        validateSlots(copy);
      };

      const handleCopyWorkdays = () => {
        const template = horarios[0];
        const copy = horarios.map(d => {
          if (d.diaSemana >= 1 && d.diaSemana <= 4) {
            return { ...d, isEncerrado: template.isEncerrado, turnos: JSON.parse(JSON.stringify(template.turnos)) };
          }
          return d;
        });
        setHorarios(copy);
        validateSlots(copy);
        setNotification({ type: 'info', message: 'Horários de Segunda-feira copiados para Terça a Sexta-feira!' });
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-black text-xl shadow">
                  P
                </div>
                <div>
                  <span className="text-lg font-black tracking-tight text-slate-900">DeliveryPartner</span>
                  <span className="hidden sm:inline-block ml-2 text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">
                    Portal do Comerciante
                  </span>
                </div>
              </div>

              {/* Controlo de Demonstração */}
              <div className="flex items-center space-x-2 text-xs">
                <span className="text-slate-400 font-medium hidden md:inline">Simular Fluxo:</span>
                <button
                  onClick={() => { setViewMode('ONBOARDING'); setActiveStep(1); }}
                  className={`px-3 py-1.5 rounded-lg font-bold transition ${viewMode === 'ONBOARDING' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}
                >
                  1. Registo (RN-010)
                </button>
                <button
                  onClick={() => { setViewMode('PENDING_REVIEW'); setStoreStatus('PENDENTE'); }}
                  className={`px-3 py-1.5 rounded-lg font-bold transition ${viewMode === 'PENDING_REVIEW' ? 'bg-amber-600 text-white' : 'bg-amber-100 text-amber-800'}`}
                >
                  2. Análise (RN-011)
                </button>
                <button
                  onClick={() => { setViewMode('ACTIVE_HOURS'); setStoreStatus('ATIVO'); }}
                  className={`px-3 py-1.5 rounded-lg font-bold transition ${viewMode === 'ACTIVE_HOURS' ? 'bg-emerald-600 text-white' : 'bg-emerald-100 text-emerald-800'}`}
                >
                  3. Horários (RN-012)
                </button>
              </div>
            </div>
          </header>

          {/* Notificação */}
          {notification && (
            <div className="max-w-7xl mx-auto px-4 mt-4 w-full">
              <div className={`p-4 rounded-xl flex items-center justify-between border shadow-sm ${
                notification.type === 'success' ? 'bg-emerald-50 border-emerald-300 text-emerald-900' :
                notification.type === 'error' ? 'bg-rose-50 border-rose-300 text-rose-900' :
                'bg-blue-50 border-blue-300 text-blue-900'
              }`}>
                <p className="text-sm font-semibold">{notification.message}</p>
                <button onClick={() => setNotification(null)} className="text-xs font-bold uppercase underline">Fechar</button>
              </div>
            </div>
          )}

          {/* Grid Principal */}
          <div className="max-w-7xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
            {/* Sidebar */}
            <aside className="lg:col-span-3">
              <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-6 sticky top-24">
                <div className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Estado da Loja</span>
                  <div className="mt-2 flex items-center space-x-2">
                    <span className={`w-3 h-3 rounded-full ${storeStatus === 'ATIVO' ? 'bg-emerald-500' : 'bg-amber-500 animate-pulse'}`} />
                    <span className={`text-sm font-bold ${storeStatus === 'ATIVO' ? 'text-emerald-700' : 'text-amber-700'}`}>
                      {storeStatus === 'ATIVO' ? 'Loja Aprovada & Ativa' : 'Em Análise Documental (RN-011)'}
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 mt-2 font-medium truncate">{empresa.nomeComercial}</p>
                </div>

                <nav className="space-y-1">
                  <button
                    onClick={() => setViewMode('ONBOARDING')}
                    className={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium ${viewMode === 'ONBOARDING' ? 'bg-emerald-50 text-emerald-900 font-bold' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    <span>Formulário Onboarding</span>
                    <span className="text-[10px] bg-slate-200 px-1 rounded">RN-010</span>
                  </button>

                  <button
                    onClick={() => setViewMode('PENDING_REVIEW')}
                    className={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium ${viewMode === 'PENDING_REVIEW' ? 'bg-amber-50 text-amber-900 font-bold' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    <span>Análise Documental</span>
                    <span className="text-[10px] bg-amber-100 text-amber-800 px-1 rounded">RN-011</span>
                  </button>

                  <button
                    onClick={() => { if (storeStatus === 'ATIVO') setViewMode('ACTIVE_HOURS'); }}
                    disabled={storeStatus === 'PENDENTE'}
                    className={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium ${
                      viewMode === 'ACTIVE_HOURS' ? 'bg-emerald-50 text-emerald-900 font-bold' :
                      storeStatus === 'PENDENTE' ? 'text-slate-300 cursor-not-allowed' : 'text-slate-600 hover:bg-slate-100'
                    }`}
                  >
                    <span className="flex items-center space-x-1">
                      <span>Horários Semanais</span>
                      {storeStatus === 'PENDENTE' && <span>🔒</span>}
                    </span>
                    <span className="text-[10px] bg-slate-100 px-1 rounded">RN-012</span>
                  </button>

                  <div className="pt-2 border-t border-slate-100">
                    <div className="px-3 py-2 text-sm text-slate-300 flex items-center justify-between cursor-not-allowed">
                      <span>Catálogo & Menu 🔒</span>
                      <span className="text-[10px]">RN-014</span>
                    </div>
                  </div>
                </nav>
              </div>
            </aside>

            {/* Conteúdo Central */}
            <main className="lg:col-span-9 space-y-6">
              {/* VISTA 1: ONBOARDING STEPPERS */}
              {viewMode === 'ONBOARDING' && (
                <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8">
                  {/* Stepper */}
                  <div className="mb-8 relative flex items-center justify-between">
                    <div className="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-slate-200 z-0" />
                    <div className="absolute left-0 top-1/2 -translate-y-1/2 h-1 bg-emerald-600 z-0 transition-all duration-300" style={{ width: `${((activeStep - 1) / 3) * 100}%` }} />
                    {[
                      { step: 1, label: 'Empresa' },
                      { step: 2, label: 'Dados Bancários' },
                      { step: 3, label: 'Licenças' },
                      { step: 4, label: 'Confirmação' },
                    ].map(s => (
                      <div key={s.step} className="relative z-10 flex flex-col items-center">
                        <button
                          onClick={() => { if (s.step < activeStep) setActiveStep(s.step); }}
                          className={`w-9 h-9 rounded-full flex items-center justify-center font-bold text-xs shadow-sm transition ${
                            activeStep > s.step ? 'bg-emerald-600 text-white' :
                            activeStep === s.step ? 'bg-slate-900 text-white ring-4 ring-slate-100' :
                            'bg-white border-2 border-slate-300 text-slate-400'
                          }`}
                        >
                          {activeStep > s.step ? '✓' : s.step}
                        </button>
                        <span className="mt-1.5 text-xs font-bold text-slate-700">{s.label}</span>
                      </div>
                    ))}
                  </div>

                  {/* Passo 1 */}
                  {activeStep === 1 && (
                    <div className="space-y-5">
                      <div>
                        <h2 className="text-xl font-bold text-slate-900">Passo 1: Identificação Comercial e Fiscal</h2>
                        <p className="text-xs text-slate-500 mt-1">Regra RN-010: NIF único e dados empresariais auditados.</p>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div className="sm:col-span-2">
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nome Comercial do Estabelecimento *</label>
                          <input
                            type="text"
                            value={empresa.nomeComercial}
                            onChange={e => setEmpresa({...empresa, nomeComercial: e.target.value})}
                            className="w-full px-4 py-2 border rounded-xl text-sm border-slate-300 focus:ring-2 focus:ring-emerald-500"
                          />
                          {empresaErrors.nomeComercial && <p className="text-xs text-rose-600 mt-1">{empresaErrors.nomeComercial}</p>}
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-1">NIF Único *</label>
                          <input
                            type="text"
                            value={empresa.nif}
                            onChange={e => setEmpresa({...empresa, nif: e.target.value})}
                            className="w-full px-4 py-2 border rounded-xl text-sm border-slate-300 focus:ring-2 focus:ring-emerald-500"
                          />
                          {empresaErrors.nif && <p className="text-xs text-rose-600 mt-1">{empresaErrors.nif}</p>}
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Categoria Comercial *</label>
                          <select
                            value={empresa.categoriaComercial}
                            onChange={e => setEmpresa({...empresa, categoriaComercial: e.target.value})}
                            className="w-full px-4 py-2 border rounded-xl text-sm border-slate-300"
                          >
                            <option>Restaurante Tradicional & Grelhados</option>
                            <option>Pizzaria & Massas</option>
                            <option>Hamburgueria & Fast Food</option>
                            <option>Supermercado & Mercearia</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Contacto Telefónico *</label>
                          <input
                            type="text"
                            value={empresa.telefone}
                            onChange={e => setEmpresa({...empresa, telefone: e.target.value})}
                            className="w-full px-4 py-2 border rounded-xl text-sm border-slate-300"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Email Corporativo *</label>
                          <input
                            type="email"
                            value={empresa.email}
                            onChange={e => setEmpresa({...empresa, email: e.target.value})}
                            className="w-full px-4 py-2 border rounded-xl text-sm border-slate-300"
                          />
                        </div>

                        <div className="sm:col-span-2">
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Morada Física para Recolha *</label>
                          <input
                            type="text"
                            value={empresa.moradaTexto}
                            onChange={e => setEmpresa({...empresa, moradaTexto: e.target.value})}
                            className="w-full px-4 py-2 border rounded-xl text-sm border-slate-300"
                          />
                        </div>
                      </div>

                      <div className="pt-4 flex justify-end">
                        <button
                          onClick={() => { if (validateStep1()) setActiveStep(2); }}
                          className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow"
                        >
                          Seguinte: Dados Bancários →
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Passo 2 */}
                  {activeStep === 2 && (
                    <div className="space-y-5">
                      <div>
                        <h2 className="text-xl font-bold text-slate-900">Passo 2: Dados Bancários de Liquidação</h2>
                        <p className="text-xs text-slate-500 mt-1">Regra RN-010: JSONField com IBAN validado para liquidação semanal.</p>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div className="sm:col-span-2">
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Instituição Bancária *</label>
                          <input
                            type="text"
                            value={dadosBancarios.banco}
                            onChange={e => setDadosBancarios({...dadosBancarios, banco: e.target.value})}
                            className="w-full px-4 py-2 border rounded-xl text-sm border-slate-300"
                          />
                        </div>

                        <div className="sm:col-span-2">
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Titular da Conta *</label>
                          <input
                            type="text"
                            value={dadosBancarios.titularConta}
                            onChange={e => setDadosBancarios({...dadosBancarios, titularConta: e.target.value})}
                            className="w-full px-4 py-2 border rounded-xl text-sm border-slate-300"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Número de Conta *</label>
                          <input
                            type="text"
                            value={dadosBancarios.numeroConta}
                            onChange={e => setDadosBancarios({...dadosBancarios, numeroConta: e.target.value})}
                            className="w-full px-4 py-2 border rounded-xl text-sm border-slate-300"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Código SWIFT/BIC</label>
                          <input
                            type="text"
                            value={dadosBancarios.swiftBic}
                            onChange={e => setDadosBancarios({...dadosBancarios, swiftBic: e.target.value})}
                            className="w-full px-4 py-2 border rounded-xl text-sm border-slate-300"
                          />
                        </div>

                        <div className="sm:col-span-2">
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-1">IBAN *</label>
                          <input
                            type="text"
                            value={dadosBancarios.iban}
                            onChange={e => setDadosBancarios({...dadosBancarios, iban: e.target.value})}
                            className="w-full px-4 py-2 border rounded-xl text-sm font-mono border-slate-300"
                          />
                          {bancoErrors.iban && <p className="text-xs text-rose-600 mt-1">{bancoErrors.iban}</p>}
                        </div>
                      </div>

                      <div className="pt-4 flex justify-between">
                        <button onClick={() => setActiveStep(1)} className="px-5 py-2.5 border rounded-xl text-sm font-bold">← Voltar</button>
                        <button
                          onClick={() => { if (validateStep2()) setActiveStep(3); }}
                          className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow"
                        >
                          Seguinte: Licenças →
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Passo 3 */}
                  {activeStep === 3 && (
                    <div className="space-y-5">
                      <div>
                        <h2 className="text-xl font-bold text-slate-900">Passo 3: Carregamento de Licenças</h2>
                        <p className="text-xs text-slate-500 mt-1">Regra RN-010: Documentos oficiais de saúde pública e registo comercial.</p>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="p-4 rounded-xl border-2 border-dashed border-slate-300 text-center">
                          <div className="text-2xl mb-1">🏥</div>
                          <h4 className="text-xs font-bold">Licença Sanitária *</h4>
                          <p className="text-[11px] text-slate-500 mb-2">Comprovativo de saúde alimentar</p>
                          <div className="p-2 bg-slate-50 border rounded-lg text-xs font-semibold text-slate-700 flex justify-between items-center">
                            <span className="truncate">{licencaSanitaria.fileName}</span>
                            <span className="text-emerald-700 text-[10px] bg-emerald-100 px-1 rounded">OK</span>
                          </div>
                        </div>

                        <div className="p-4 rounded-xl border-2 border-dashed border-slate-300 text-center">
                          <div className="text-2xl mb-1">🏢</div>
                          <h4 className="text-xs font-bold">Alvará Comercial *</h4>
                          <p className="text-[11px] text-slate-500 mb-2">Autorização de funcionamento legal</p>
                          <div className="p-2 bg-slate-50 border rounded-lg text-xs font-semibold text-slate-700 flex justify-between items-center">
                            <span className="truncate">{alvaraComercial.fileName}</span>
                            <span className="text-emerald-700 text-[10px] bg-emerald-100 px-1 rounded">OK</span>
                          </div>
                        </div>
                      </div>

                      <div className="pt-4 flex justify-between">
                        <button onClick={() => setActiveStep(2)} className="px-5 py-2.5 border rounded-xl text-sm font-bold">← Voltar</button>
                        <button onClick={() => setActiveStep(4)} className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow">
                          Seguinte: Resumo Final →
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Passo 4 */}
                  {activeStep === 4 && (
                    <div className="space-y-5">
                      <div>
                        <h2 className="text-xl font-bold text-slate-900">Passo 4: Resumo e Confirmação</h2>
                        <p className="text-xs text-slate-500 mt-1">Ao submeter, o registo transitará para o estado <strong>Pendente (RN-011)</strong>.</p>
                      </div>

                      <div className="space-y-3 text-xs">
                        <div className="p-3 bg-slate-50 rounded-xl border">
                          <span className="font-bold uppercase text-slate-400 block mb-1">Empresa</span>
                          <p><strong className="text-slate-800">{empresa.nomeComercial}</strong> | NIF: {empresa.nif}</p>
                          <p className="text-slate-500">{empresa.moradaTexto}</p>
                        </div>

                        <div className="p-3 bg-slate-50 rounded-xl border">
                          <span className="font-bold uppercase text-slate-400 block mb-1">Conta Bancária</span>
                          <p>{dadosBancarios.banco} | Titular: {dadosBancarios.titularConta}</p>
                          <p className="font-mono">{dadosBancarios.iban}</p>
                        </div>
                      </div>

                      <div className="pt-4 flex justify-between">
                        <button onClick={() => setActiveStep(3)} className="px-5 py-2.5 border rounded-xl text-sm font-bold">← Voltar</button>
                        <button
                          onClick={handleSubmitOnboarding}
                          disabled={isSubmitting}
                          className="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow-md"
                        >
                          {isSubmitting ? 'A submeter documentação...' : 'Submeter Documentação para Homologação (RN-011) ✓'}
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* VISTA 2: BLOQUEIO AMIGÁVEL DE CONTA EM ANÁLISE (RN-011) */}
              {viewMode === 'PENDING_REVIEW' && (
                <div className="bg-white rounded-3xl border border-amber-200 shadow-sm p-6 sm:p-10 space-y-8">
                  <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 p-6 bg-amber-50 border border-amber-200 rounded-2xl">
                    <div className="flex items-start space-x-4">
                      <div className="text-4xl">⏳</div>
                      <div>
                        <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-200 text-amber-900 uppercase">
                          RN-011: Estado Pendente
                        </span>
                        <h2 className="text-xl font-bold text-slate-900 mt-1">Conta em Análise Documental</h2>
                        <p className="text-xs text-slate-600 mt-1">A equipa de compliance está a verificar a Licença Sanitária e Alvará.</p>
                      </div>
                    </div>
                    <button
                      onClick={() => { setStoreStatus('ATIVO'); setViewMode('ACTIVE_HOURS'); }}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow"
                    >
                      Simular Aprovação Humana ✓
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                    <div className="p-3 rounded-xl border border-emerald-200 bg-emerald-50">
                      <strong className="text-emerald-800 block mb-1">1. Submissão</strong>
                      <p className="text-slate-600">Documentação e NIF recebidos.</p>
                    </div>
                    <div className="p-3 rounded-xl border-2 border-amber-400 bg-amber-50">
                      <strong className="text-amber-900 block mb-1">2. Análise Técnica</strong>
                      <p className="text-slate-600">Validação em curso pelas Operações (&lt; 24h).</p>
                    </div>
                    <div className="p-3 rounded-xl border bg-slate-50 text-slate-400">
                      <strong className="block mb-1">3. Abertura ao Público</strong>
                      <p>Ativação de cardápio e encomendas.</p>
                    </div>
                  </div>

                  <div className="p-6 rounded-2xl bg-slate-50 border text-center space-y-2">
                    <div className="text-3xl">🔒</div>
                    <h3 className="text-sm font-bold text-slate-800">Publicação de Menu Bloqueada (RN-011)</h3>
                    <p className="text-xs text-slate-500 max-w-lg mx-auto">
                      A publicação de itens e a receção de encomendas permanecem suspensas até que a equipa homologue a licença sanitária do estabelecimento.
                    </p>
                  </div>
                </div>
              )}

              {/* VISTA 3: CONFIGURAÇÃO DE HORÁRIOS SEMANAIS (RN-012) */}
              {viewMode === 'ACTIVE_HOURS' && (
                <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-5">
                    <div>
                      <span className="px-2.5 py-0.5 rounded text-xs font-bold bg-emerald-100 text-emerald-800">
                        RN-012: Operação Ativa
                      </span>
                      <h2 className="text-xl font-bold text-slate-900 mt-1">Configuração de Horários Semanais</h2>
                      <p className="text-xs text-slate-500">
                        Defina múltiplos turnos de funcionamento. A interface bloqueia turnos com fecho anterior à abertura.
                      </p>
                    </div>

                    <div className="flex space-x-2">
                      <button
                        onClick={handleCopyWorkdays}
                        className="px-3 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl"
                      >
                        Copiar 2ª p/ Dias Úteis
                      </button>
                      <button
                        onClick={() => {
                          validateSlots(horarios);
                          if (horarioErrors.length === 0) {
                            setNotification({ type: 'success', message: 'Horários sincronizados com a API (PUT /hours/) com sucesso!' });
                          }
                        }}
                        disabled={horarioErrors.length > 0}
                        className="px-5 py-2 text-xs font-bold bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white rounded-xl shadow"
                      >
                        Guardar Horários
                      </button>
                    </div>
                  </div>

                  {/* Alertas de validação de horário */}
                  {horarioErrors.length > 0 && (
                    <div className="p-3 rounded-xl bg-rose-50 border border-rose-300 text-rose-800 text-xs space-y-1">
                      <span className="font-bold">Erros de Validação Horária (RN-012):</span>
                      <ul className="list-disc pl-4 space-y-0.5">
                        {horarioErrors.map((err, i) => <li key={i}>{err}</li>)}
                      </ul>
                    </div>
                  )}

                  {/* Tabela de Horários */}
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead>
                        <tr className="border-b text-xs text-slate-400 uppercase">
                          <th className="py-3 px-3 w-32 font-bold">Dia</th>
                          <th className="py-3 px-3 w-28 font-bold">Estado</th>
                          <th className="py-3 px-3 font-bold">Intervalos de Abertura / Fecho</th>
                          <th className="py-3 px-3 w-24 text-right font-bold">Ação</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {horarios.map((dia, diaIdx) => (
                          <tr key={dia.diaSemana} className={dia.isEncerrado ? 'bg-slate-50/50 opacity-60' : ''}>
                            <td className="py-3 px-3 font-bold text-slate-900">{dia.diaNome}</td>
                            <td className="py-3 px-3">
                              <button
                                onClick={() => handleToggleEncerrado(diaIdx)}
                                className={`px-2.5 py-1 rounded-full text-xs font-bold ${
                                  dia.isEncerrado ? 'bg-slate-200 text-slate-700' : 'bg-emerald-100 text-emerald-800'
                                }`}
                              >
                                {dia.isEncerrado ? 'Fechado' : 'Aberto'}
                              </button>
                            </td>
                            <td className="py-3 px-3">
                              {dia.isEncerrado ? (
                                <span className="text-xs text-slate-400 italic">Encerrado ao público</span>
                              ) : (
                                <div className="flex flex-wrap gap-2">
                                  {dia.turnos.map((t, slotIdx) => {
                                    const isValid = t.horaFecho > t.horaAbertura;
                                    return (
                                      <div
                                        key={t.id}
                                        className={`inline-flex items-center space-x-1.5 p-1.5 rounded-lg border text-xs font-mono font-bold ${
                                          isValid ? 'bg-slate-50 border-slate-300' : 'bg-rose-50 border-rose-400 text-rose-700'
                                        }`}
                                      >
                                        <input
                                          type="time"
                                          value={t.horaAbertura}
                                          onChange={e => handleUpdateTimeSlot(diaIdx, slotIdx, 'horaAbertura', e.target.value)}
                                          className="p-1 bg-white border rounded text-xs"
                                        />
                                        <span>às</span>
                                        <input
                                          type="time"
                                          value={t.horaFecho}
                                          onChange={e => handleUpdateTimeSlot(diaIdx, slotIdx, 'horaFecho', e.target.value)}
                                          className="p-1 bg-white border rounded text-xs"
                                        />
                                        {dia.turnos.length > 1 && (
                                          <button
                                            onClick={() => handleRemoveSlot(diaIdx, slotIdx)}
                                            className="text-slate-400 hover:text-rose-600 px-1 font-bold"
                                          >
                                            ✕
                                          </button>
                                        )}
                                      </div>
                                    );
                                  })}
                                </div>
                              )}
                            </td>
                            <td className="py-3 px-3 text-right">
                              {!dia.isEncerrado && (
                                <button
                                  onClick={() => handleAddSlot(diaIdx)}
                                  className="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg border"
                                >
                                  + Turno
                                </button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
