name: delivery_mobile
description: Aplicação Mobile Flutter da Plataforma de Delivery Ango_Ifood (Cliente / Entregador / Parceiro).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  google_maps_flutter: ^2.5.3
  web_socket_channel: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  # Garante a inclusão dos glifos oficiais do Material Design Icons
  # e impede a substituição acidental de ícones por caracteres estrangeiros/CJK
  uses-material-design: true

  # Diretórios de assets locais dedicados a ícones vetoriais e imagens
  assets:
    - assets/icons/
    - assets/images/
