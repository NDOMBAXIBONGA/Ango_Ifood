# Configuração da Ferramenta de Geração Automática de Ícones de Lançamento
# Executar via CLI: flutter pub run flutter_launcher_icons (ou dart run flutter_launcher_icons)

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon_app.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon_app.png"
  remove_alpha_ios: true

